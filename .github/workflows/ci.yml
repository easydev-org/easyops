name: ci

# Check every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  # `gh release view` needs a token; the implicit GITHUB_TOKEN is enough for
  # reading a release in a sibling PUBLIC repo, but it must be exported.
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # cmd/easyops/ui.go has `//go:embed all:ui/dist`, and that dist/ is produced
      # by Containerfile.build from easyops-webui. Nothing is committed, so every
      # go command fails until it exists:
      #   cmd/easyops/ui.go:14:12: pattern all:ui/dist: no matching files found
      - name: build the admin SPA into the embed path
        run: |
          set -euo pipefail
          # Pin the UI to its newest RELEASE, not to main. A branch tip is
          # not reproducible: this build would embed whatever happened to be
          # pushed, with nothing recording which commit it was.
          u=$(gh release view --repo easydev-org/easyops-webui --json tagName -q .tagName) \
            || { echo "::error::easydev-org/easyops-webui has no Release to pin to"; exit 1; }
          echo "ui=easydev-org/easyops-webui@$u"
          git clone --depth 1 --branch "$u" \
            https://github.com/easydev-org/easyops-webui.git /tmp/webui
          cd /tmp/webui
          npm ci --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/cmd/easyops/ui/dist"
          OUT_DIR="$GITHUB_WORKSPACE/cmd/easyops/ui/dist" npm run build
          echo "SPA files: $(find "$GITHUB_WORKSPACE/cmd/easyops/ui/dist" -type f | wc -l)"

      - run: go vet ./...

      - run: go test ./...

      - run: go build ./...

      - name: assert the binary is static
        run: |
          set -euo pipefail
          go build -ldflags "-s -w" -o /tmp/easyops ./cmd/easyops
          if readelf -l /tmp/easyops | grep -q INTERP; then
            echo "::error::easyops is dynamically linked"
            exit 1
          fi
          echo "static: OK"

  # The unit tests use a fake clientset, so they cannot catch a kubelet-level
  # failure: a security context the kubelet refuses, a mount a non-root
  # container cannot write, a Service that does not resolve, an exit code that
  # is not reported. This job runs the jobmgr suite against a REAL k3s (k3d =
  # k3s in Docker) so those failures are caught before a deployment.
  integration-k3d:
    name: integration (k3d)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The embedded SPA is only needed by ./cmd/easyops; this job exercises the
      # k8s library packages, so skip the node build entirely.
      - name: create the k3d cluster
        run: ./scripts/k3d-up.sh easyops-ci

      - name: sanity-check the cluster
        run: |
          kubectl version
          kubectl get nodes -o wide
          kubectl get storageclass

      - name: run the integration suite
        run: ./scripts/integration.sh

      - name: cluster diagnostics
        if: failure()
        run: |
          echo "--- nodes ---"
          kubectl get nodes -o wide || true
          echo "--- all pods ---"
          kubectl get pods -A || true
          echo "--- k3d logs (server) ---"
          k3d node list || true
          docker ps -a || true

      - name: delete the cluster
        if: always()
        run: k3d cluster delete easyops-ci || true

