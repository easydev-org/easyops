name: ci

# Check every push and pull request: vet, test, build.
#
# This repo had NO CI. That mattered more than usual here because the binary is
# only produced when an image is built — a compile error sat in main until
# someone tried to ship it.
#
# CGO_ENABLED=0 is deliberate: the artifacts these repos produce run in
# containers and in guests (Android's bionic, alpine's musl), so a dynamically
# linked binary is a latent failure that only shows up where the interpreter is
# missing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      - run: go test ./...

      # Build everything, not just one main: a package that no longer compiles is
      # still a broken repository even if the entrypoint happens to build.
      - run: go build ./...

      - name: assert the tree is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy"
            exit 1
          }
